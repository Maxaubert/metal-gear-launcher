# Auto-release on every push to main.
# - Reads the version from package.json.
# - REFUSES to run if release v<version> already exists: bump the version in the PR.
# - Fetches the two MIT extraction tools, builds, packages the NSIS installer via
#   electron-builder, and publishes v<version> with GitHub-generated notes.
# - Signing is a no-op until this repo is enrolled with SignPath (see CLAUDE.md).
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Refuse to overwrite an existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Release $tag already exists. Bump the version in package.json (patch for a fix, minor for a feature) and push again."
            exit 1
          }
          # gh exiting 1 (release absent) is the pass case, but the pwsh step
          # wrapper propagates a lingering $LASTEXITCODE as the step result.
          exit 0

      - run: npm ci

      - name: Fetch extraction tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run fetch-tools

      - run: npm run build

      # A clean checkout has no private media. Always retain this smaller installer.
      - name: Package Lite installer
        run: node scripts/package-launcher.mjs

      - name: Fetch optional approved music pack
        id: music
        shell: pwsh
        env:
          MUSIC_PACK_URL: ${{ vars.MENU_MUSIC_PACK_URL }}
          MUSIC_PACK_SHA256: ${{ vars.MENU_MUSIC_PACK_SHA256 }}
        run: |
          if ($env:MUSIC_PACK_URL -or $env:MUSIC_PACK_SHA256) {
            if (-not $env:MUSIC_PACK_URL -or -not $env:MUSIC_PACK_SHA256) { throw 'Configure both music pack URL and SHA256.' }
            ./scripts/fetch-menu-music-pack.ps1 -Url $env:MUSIC_PACK_URL -Sha256 $env:MUSIC_PACK_SHA256
            "ready=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Output 'No optional music pack configured. Publishing the Lite installer.'
          }

      - name: Package Full installer
        if: steps.music.outputs.ready == 'true'
        run: node scripts/package-launcher.mjs

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release create $tag dist/*.exe --generate-notes
