# electron-builder configuration: Windows NSIS installer.
# `resources/tools` (fetched by `npm run fetch-tools`, never committed) ships as extraResources
# so the extractor can spawn AssetStudioModCLI and FreeMote from the installed app the same way
# it does in development from `resources/tools` directly.
# Keep the existing identity so this rename upgrades the installed launcher.
appId: com.maxaubert.mgsmasterhub
productName: Metal Gear Launcher
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/7zip-bin-full/**
extraResources:
  - from: resources/tools
    to: tools
  - from: resources/menu-music
    to: menu-music
    filter:
      - "**/*.mp3"
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  artifactName: "MetalGearLauncher-Setup-x64-${version}.exe"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createStartMenuShortcut: true
  shortcutName: Metal Gear Launcher
publish:
  provider: github
  owner: Maxaubert
  repo: metal-gear-launcher
